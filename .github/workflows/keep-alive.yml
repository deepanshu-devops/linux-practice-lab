name: Keep-alive

on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render URL
        run: |
          curl -fsS -o /dev/null \
            -A "keep-alive (github-actions)" \
            "${{ vars.RENDER_URL || 'https://linux-practice-lab.onrender.com/health' }}"
